name: 即時快訊
on:
  schedule:
    - cron: "17 * * * *"   # 每小時第 17 分
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: latest
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取新聞標題
        run: python3 scripts/fetch_latest.py
      - name: 有變動才提交
        run: |
          git config user.name "news-brief-bot"
          git config user.email "news-brief-bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "即時快訊更新"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
